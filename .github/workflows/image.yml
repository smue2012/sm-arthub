# Testet sm-arthub (auch gegen PostgreSQL) und baut das Image
# ghcr.io/smue2012/sm-arthub.
#
# Tags: «latest» und «main-<commit>» bei jedem Push auf main,
#       «<branch>» bei Pushes auf andere Branches,
#       «26.11.1» usw. beim Setzen eines Git-Tags v26.11.1.
name: Image

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  testen:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./...
      - name: Tests (inkl. Datenbank)
        env:
          ARTHUB_TEST_DB: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
        run: go test ./... -count=1

  bauen:
    needs: testen
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sm-arthub
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
            type=match,pattern=v(.*),group=1

      - id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "wert=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "wert=${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.wert }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sm-arthub
          cache-to: type=gha,mode=max,scope=sm-arthub
