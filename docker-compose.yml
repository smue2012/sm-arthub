# Stack für Portainer.
#
# Vor dem Bereitstellen in Portainer als Umgebungsvariable setzen:
#   ARTHUB_DB_PASSWORT     Passwort der Datenbank (frei wählen, nur hier)
#   ARTHUB_ADMIN_PASSWORT  Passwort der Verwaltungsoberfläche (mind. 12 Zeichen)
#   ARTHUB_ADMIN_PORT      Port der Verwaltung auf dem Host (Vorgabe 8111)
#   ARTHUB_VERSION       Image-Tag, z.B. 26.11.1 (Vorgabe: latest)
#   ARTHUB_NETZ_INTERN   Subnetz zwischen Hub und Datenbank (Vorgabe 10.250.250.0/28)
#   ARTHUB_NETZ          Subnetz des Netzes «arthub» für die Apps (Vorgabe 10.250.250.16/28)
#
# Die Subnetze sind fest vorgegeben, damit der Stack auch dann startet, wenn
# die Standard-Adresspools von Docker aufgebraucht sind. Sie dürfen sich nicht
# mit dem LAN, einem VPN oder anderen Docker-Netzen überschneiden.
#
# Die Lese-API (8110) ist bewusst NICHT veröffentlicht, nur im Docker-Netz.
# Veröffentlicht wird nur die Verwaltungsoberfläche (8111) – am besten über den
# Reverse-Proxy (NPM) mit HTTPS und nur im internen Netz.
# Der Stack legt das Docker-Netz «arthub» selbst an. Die Apps (smerp, smshop)
# hängen sich in ihrem Stack als externes Netz daran und erreichen den Hub
# unter http://sm-arthub:8110:
#   networks:
#     arthub:
#       external: true

services:
  sm-arthub:
    image: ghcr.io/smue2012/sm-arthub:${ARTHUB_VERSION:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://arthub:${ARTHUB_DB_PASSWORT}@db:5432/arthub?sslmode=disable
      PORT: "8110"
      ADMIN_PORT: "8111"
      ARTHUB_ADMIN_PASSWORT: ${ARTHUB_ADMIN_PASSWORT}
    ports:
      - "${ARTHUB_ADMIN_PORT:-8111}:8111"
    depends_on:
      - db
    networks:
      - intern
      - arthub

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: arthub
      POSTGRES_PASSWORD: ${ARTHUB_DB_PASSWORT}
      POSTGRES_DB: arthub
    volumes:
      - arthub-db:/var/lib/postgresql/data
    networks:
      - intern

volumes:
  arthub-db:

networks:
  intern:
    ipam:
      config:
        - subnet: ${ARTHUB_NETZ_INTERN:-10.250.250.0/28}
  arthub:
    name: arthub
    ipam:
      config:
        - subnet: ${ARTHUB_NETZ:-10.250.250.16/28}
